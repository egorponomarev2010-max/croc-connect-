const STORAGE='croc-connect-ai-product-v4';let db=load();let view='overview',companyId=db.companies[0]?.id,selectedId=null,search='',depFilter='',stanceFilter='',draft=null,marketingDepartment='';
function clone(o){return JSON.parse(JSON.stringify(o))}function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x&&Array.isArray(x.companies)&&Array.isArray(x.people))return mergeSeed(x)}catch(e){}return clone(SEED)}function mergeSeed(x){let a=clone(x);for(const key of ['companies','people','links','meetings','interactions','tasks']){if(!Array.isArray(a[key]))a[key]=[];let ids=new Set(a[key].map(z=>z.id));for(const z of SEED[key])if(!ids.has(z.id)){a[key].push(clone(z));ids.add(z.id)}}return a}function save(){try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch(e){alert('Не удалось сохранить данные браузера. Экспортируйте резервную копию.')}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(id){return document.getElementById(id)}function company(){return db.companies.find(x=>x.id===companyId)||db.companies[0]}function people(){return db.people.filter(p=>p.company_id===companyId)}function links(){return db.links.filter(l=>l.company_id===companyId)}function interactions(){return db.interactions.filter(x=>x.company_id===companyId).sort((a,b)=>String(b.date).localeCompare(String(a.date)))}function selected(){return db.people.find(p=>p.id===selectedId)}function formatDate(s){try{return new Date(s+'T12:00:00').toLocaleDateString('ru-RU')}catch(e){return s}}function companySelector(){return `<select class="field" id="companySelect" style="max-width:360px">${db.companies.map(c=>`<option value="${esc(c.id)}" ${c.id===companyId?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}function stats(){return [{v:db.companies.length,l:'Компаний в базе'},{v:db.people.length,l:'Контактов'},{v:db.links.length,l:'Связей на карте'},{v:db.interactions.length,l:'Зафиксированных взаимодействий'}].map(x=>`<div class="metric"><strong>${x.v}</strong><span>${x.l}</span></div>`).join('')}function badgeStance(s){return s==='positive'?'<span class="tag green">Сторонник</span>':s==='negative'?'<span class="tag orange">Возражает</span>':s==='neutral'?'<span class="tag">Нейтрально</span>':'<span class="tag">Не определено</span>'}function initials(p){return p.name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}function peopleFiltered(){return people().filter(p=>(!search||(p.name+' '+p.role+' '+p.department).toLowerCase().includes(search.toLowerCase()))&&(!depFilter||p.department===depFilter)&&(!stanceFilter||p.stance===stanceFilter))}function personList(ps){return `<div class="personlist">${ps.length?ps.map(p=>`<button class="person ${selectedId===p.id?'active':''}" data-person="${esc(p.id)}"><div class="row" style="flex-wrap:nowrap"><div class="avatar">${esc(initials(p))}</div><div><b>${esc(p.name)}</b><div class="small">${esc(p.role)} · ${esc(p.department||'Без отдела')}</div></div></div>${badgeStance(p.stance)}</button>`).join(''):'<div class="empty">Нет сотрудников по выбранным фильтрам</div>'}</div>`}function personDetails(p){if(!p)return '<div class="empty">Выберите сотрудника на карте или в списке</div>';let n=db.interactions.filter(x=>x.person_id===p.id).length;return `<div class="row"><div class="avatar" style="width:55px;height:55px">${esc(initials(p))}</div><div><h2 style="margin:0">${esc(p.name)}</h2><div class="small">${esc(p.role)}</div></div></div><div class="divider"></div><div class="cards"><div class="mini"><b>Подразделение</b>${esc(p.department||'—')}</div><div class="mini"><b>Влияние</b>${p.influence??'Не определено'} / 5</div><div class="mini"><b>Отношение</b>${badgeStance(p.stance)}</div><div class="mini"><b>Взаимодействий</b>${n}</div></div><div class="mini" style="margin-top:12px"><b>Приоритеты</b>${esc(p.work_priority||'Не указаны')}</div><div class="mini" style="margin-top:12px"><b>Подход к коммуникации</b>${esc(p.approach||'Не указан')}</div><div class="mini" style="margin-top:12px"><b>Заметки</b>${esc(p.notes||'Пока нет')}</div><div class="row" style="margin-top:15px"><button class="btn secondary" data-action="editPerson">Редактировать</button><button class="btn" data-action="openAssistant">✦ После встречи</button></div>`}function graph(){let ps=peopleFiltered(),all=people(),ids=new Set(ps.map(p=>p.id)),es=links().filter(l=>ids.has(l.from)&&ids.has(l.to));if(!ps.length)return '<div class="empty">Для этой компании пока нет контактов</div>';let w=900,h=460,cx=450,cy=230,r=Math.min(175,110+ps.length*4);let pos=new Map();ps.forEach((p,i)=>{let a=-Math.PI/2+2*Math.PI*i/ps.length;pos.set(p.id,{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r})});let lines=es.map(l=>{let a=pos.get(l.from),b=pos.get(l.to);return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#c9c1e5" stroke-width="1.7"/>`}).join('');let nodes=ps.map(p=>{let z=pos.get(p.id),c=p.stance==='positive'?'#b6e23b':p.stance==='negative'?'#f1aa92':p.influence>=4?'#8067c7':'#e4dcfa';return `<g class="node" data-node="${esc(p.id)}"><circle cx="${z.x}" cy="${z.y}" r="${p.influence>=4?27:23}" fill="${c}" stroke="${p.id===selectedId?'#49349a':'white'}" stroke-width="${p.id===selectedId?4:3}"/><text x="${z.x}" y="${z.y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#2b244c">${esc(initials(p))}</text><text x="${z.x}" y="${z.y+44}" text-anchor="middle" font-size="11" font-weight="700" fill="#4a4763">${esc(p.name.split(' ')[0])}</text></g>`}).join('');return `<div class="graphwrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Карта сотрудников и рабочих связей">${lines}${nodes}</svg></div><div class="hint" style="margin-top:10px">${ps.length} контактов · ${es.length} связей · нажмите на узел, чтобы открыть карточку. Цвета: зелёный — сторонник, фиолетовый — нейтральный/неизвестно, оранжевый — возражения.</div>`}function filterToolbar(){let deps=[...new Set(people().map(p=>p.department).filter(Boolean))].sort();return `<div class="toolbar" style="margin:14px 0"><input class="field" id="search" placeholder="Поиск по имени, роли, отделу" value="${esc(search)}"><select class="field" id="department"><option value="">Все подразделения</option>${deps.map(d=>`<option ${d===depFilter?'selected':''}>${esc(d)}</option>`).join('')}</select><select class="field" id="stance"><option value="">Любое отношение</option><option value="positive" ${stanceFilter==='positive'?'selected':''}>Сторонники</option><option value="neutral" ${stanceFilter==='neutral'?'selected':''}>Нейтральные</option><option value="negative" ${stanceFilter==='negative'?'selected':''}>Возражают</option><option value="unknown" ${stanceFilter==='unknown'?'selected':''}>Не определено</option></select></div>`}function overview(){let c=company();return `<div class="grid">${stats()}</div><div class="split"><section class="panel"><div class="row" style="justify-content:space-between"><h2>Клиентская база</h2><button class="btn secondary" data-viewto="map">Открыть карту →</button></div><div class="cards">${db.companies.slice(0,12).map(x=>{let n=db.people.filter(p=>p.company_id===x.id).length;return `<div class="companycard" data-company="${esc(x.id)}"><strong>${esc(x.name)}</strong><small>${esc(x.industry||'Компания')} · ${n} сотрудников</small></div>`}).join('')}</div><button class="btn secondary" style="margin-top:15px" data-viewto="contacts">Все ${db.companies.length} компаний и контакты →</button></section><section class="panel"><div class="eyebrow">КЛЮЧЕВОЙ СЦЕНАРИЙ</div><h2 style="margin-top:10px">Знания после каждой встречи</h2><p class="hint">Сотрудник фиксирует сведения о клиенте и ходе взаимодействия. Ассистент предлагает изменения, человек проверяет их, затем карта и история обновляются.</p><div class="step" style="margin-top:15px">① Запись встречи → ② Анализ → ③ Подтверждение → ④ Обновление базы</div><button class="btn lime" style="margin-top:16px" data-viewto="assistant">✦ Открыть AI-ассистента</button><div class="divider"></div><h2>Последние взаимодействия</h2>${db.interactions.slice(-3).reverse().map(x=>`<div class="event"><strong>${esc(db.companies.find(c=>c.id===x.company_id)?.name||'Компания')} · ${formatDate(x.date)}</strong><p>${esc(x.notes)}</p></div>`).join('')}</section></div>`}function mapView(){let c=company();return `<section class="panel"><div class="row" style="justify-content:space-between"><div><h2>Карта принятия решений</h2><div class="hint">Компания: ${esc(c.name)} · ${people().length} сотрудников · ${links().length} связей</div></div>${companySelector()}</div>${filterToolbar()}${graph()}</section><div class="split"><section class="panel"><h2>Контакты на карте</h2>${personList(peopleFiltered())}</section><section class="panel" id="personDetail"><h2>Карточка 360°</h2>${personDetails(selected())}</section></div>`}function contactsView(){return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>Единая база контактов</h2>${companySelector()}</div>${filterToolbar()}<div class="split"><div>${personList(peopleFiltered())}</div><div><h2>Карточка контакта</h2>${personDetails(selected())}</div></div></section><section class="panel"><h2>История взаимодействий · ${esc(company().name)}</h2>${timeline(interactions())}</section>`}function timeline(xs){return `<div class="timeline">${xs.length?xs.slice(0,12).map(x=>`<div class="event"><strong>${formatDate(x.date)} · ${esc(db.people.find(p=>p.id===x.person_id)?.name||'Общая встреча')} · ${esc(x.type||'Встреча')}</strong><p>${esc(x.notes)}</p>${x.next?`<div class="small">Следующий шаг: ${esc(x.next)}</div>`:''}</div>`).join(''):'<div class="empty">История пока пуста. Добавьте первую встречу через ассистента.</div>'}</div>`}function assistantView(){return `<div class="notice">✦ <b>AI-ассистент · демонстрационный режим.</b> В этой версии извлечение фактов выполняется локальными правилами, без обращения к языковой модели. Все изменения подтверждаются человеком. Не вводите реальные персональные данные клиентов.</div><div class="split"><section class="panel"><div class="row" style="justify-content:space-between"><h2>После встречи с клиентом</h2>${companySelector()}</div><div class="hint">Сотрудник фиксирует сведения о клиенте и ходе взаимодействия — система предлагает обновления базы.</div><div class="step active" style="margin-top:16px"><div><span class="stepnum">1</span><b>Зафиксировать сведения</b></div><label class="small" style="display:block;margin:12px 0 6px">С кем общались</label><select class="field" id="meetingPerson"><option value="">Общая встреча с компанией</option>${people().map(p=>`<option value="${esc(p.id)}" ${p.id===selectedId?'selected':''}>${esc(p.name)} — ${esc(p.role)}</option>`).join('')}</select><label class="small" style="display:block;margin:12px 0 6px">Дата встречи</label><input type="date" class="field" id="meetingDate" value="${new Date().toISOString().slice(0,10)}"><label class="small" style="display:block;margin:12px 0 6px">Что узнали о клиенте</label><textarea class="field" id="meetingNotes" placeholder="Например: Встретились с финансовым директором. Отношение: положительное. Влияние: 5. Интерес: облачная инфраструктура. Предпочитает общение по почте. Следующий шаг: подготовить коммерческое предложение."></textarea><div class="row" style="margin-top:12px"><button class="btn lime" data-action="analyze">✦ Проанализировать запись</button><button class="btn secondary" data-action="example">Заполнить пример</button></div></div><div class="step ${draft?'active':''}" style="margin-top:12px" id="draftPanel"><div><span class="stepnum">2</span><b>Проверить предложения</b></div>${draftHtml()}</div></section><section class="panel"><h2>Как работает обновление</h2><div class="mini"><b>① Исходная запись</b><span class="hint">Заметка сотрудника после контакта</span></div><div class="mini" style="margin-top:9px"><b>② Извлечение фактов</b><span class="hint">Отношение, влияние, интересы, канал связи, следующий шаг</span></div><div class="mini" style="margin-top:9px"><b>③ Проверка сотрудником</b><span class="hint">Изменения не применяются автоматически</span></div><div class="mini" style="margin-top:9px"><b>④ Актуализация знаний</b><span class="hint">Карточка, история и карта обновляются после подтверждения</span></div><div class="divider"></div><h2>Последние встречи · ${esc(company().name)}</h2>${timeline(interactions())}</section></div>`}function draftHtml(){if(!draft)return '<p class="hint">После анализа здесь появятся извлечённые факты, предлагаемые обновления и кнопка подтверждения.</p>';return `<p class="hint">Обнаружено предложений: <b>${draft.proposals.length}</b>. Отметьте только достоверные сведения. Запись встречи сохранится независимо от выбранных изменений.</p>${draft.proposals.length?draft.proposals.map((p,i)=>`<div class="suggestion"><input type="checkbox" id="prop${i}" checked><label for="prop${i}"><b>${esc(p.label)}</b><small>${esc(p.before)} → ${esc(p.after)}</small></label></div>`).join(''):'<div class="notice warn">Структурированные изменения не обнаружены. Можно сохранить запись в историю без изменения карточки.</div>'}<div class="row" style="margin-top:15px"><button class="btn" data-action="confirm">✓ Подтвердить и обновить базу</button><button class="btn secondary" data-action="discard">Отменить анализ</button></div>`}function extract(text,p){let arr=[];if(!p)return arr;let add=(key,label,val)=>{if(val!==undefined&&val!==null&&String(val)!==String(p[key]??''))arr.push({key,label,before:String(p[key]??'Не указано'),after:String(val),value:val})};let t=text.toLowerCase();let m=text.match(/(?:влияни[ея]|влиятельность)\s*[:—-]?\s*([1-5])\b/i);if(m)add('influence','Уровень влияния',Number(m[1]));if(/отношение\s*[:—-]?\s*(положительн|позитивн|поддержива)/i.test(t))add('stance','Отношение','positive');else if(/отношение\s*[:—-]?\s*(отрицательн|негативн|против)/i.test(t))add('stance','Отношение','negative');else if(/отношение\s*[:—-]?\s*нейтральн/i.test(t))add('stance','Отношение','neutral');m=text.match(/(?:интерес|приоритет|потребность)\s*[:—-]\s*([^.!?\n]+)/i);if(m)add('work_priority','Приоритеты / интересы',m[1].trim());m=text.match(/(?:канал|предпочитает общение|коммуникация)\s*[:—-]\s*([^.!?\n]+)/i);if(m)add('approach','Предпочтительный подход',m[1].trim());m=text.match(/(?:роль)\s*[:—-]\s*([^.!?\n]+)/i);if(m)add('role','Роль',m[1].trim());return arr}function analyze(){let notes=el('meetingNotes')?.value.trim(),personId=el('meetingPerson')?.value,date=el('meetingDate')?.value;if(!notes){alert('Сначала опишите встречу');return}let p=db.people.find(p=>p.id===personId);draft={notes,personId,date:date||new Date().toISOString().slice(0,10),companyId,proposals:extract(notes,p)};el('draftPanel').innerHTML=`<div><span class="stepnum">2</span><b>Проверить предложения</b></div>${draftHtml()}`;el('draftPanel').classList.add('active');el('draftPanel').scrollIntoView({behavior:'smooth',block:'nearest'})}function confirmDraft(){if(!draft)return;let p=db.people.find(p=>p.id===draft.personId),changed=[];draft.proposals.forEach((q,i)=>{if(el('prop'+i)?.checked&&p){p[q.key]=q.value;changed.push(q.label)}});let next=(draft.notes.match(/(?:следующий шаг|дальше|договорились)\s*[:—-]\s*([^.!?\n]+)/i)||[])[1]||'';db.interactions.push({id:'int_user_'+Date.now(),company_id:draft.companyId,person_id:draft.personId,date:draft.date,type:'Встреча',notes:draft.notes,next:next.trim(),outcome:'Подтверждено сотрудником',changed});db.meetings.push({id:'meet_user_'+Date.now(),company_id:draft.companyId,person_id:draft.personId,date:draft.date,notes:draft.notes,next:next.trim(),outcome:'Подтверждено'});save();draft=null;render();let node=el('content');node.insertAdjacentHTML('afterbegin',`<div class="notice success">✓ Запись сохранена в историю. Обновлено полей: ${changed.length}. Откройте карту или карточку контакта, чтобы увидеть результат.</div>`)}function marketingView(){let c=company(),ps=people().filter(p=>!marketingDepartment||p.department===marketingDepartment),deps=[...new Set(people().map(p=>p.department))];return `<section class="panel"><h2>Подбор аудитории для мероприятий</h2><p class="hint">Маркетинг выбирает релевантных участников клиента по роли, отделу и отношению к проекту.</p><div class="row">${companySelector()}<select class="field" style="max-width:260px" id="marketingDepartment"><option value="">Все подразделения</option>${deps.map(d=>`<option ${marketingDepartment===d?'selected':''}>${esc(d)}</option>`).join('')}</select><button class="btn secondary" data-action="copyAudience">Скопировать список</button></div><div class="divider"></div><div class="row"><span class="tag green">Найдено ${ps.length} контактов</span><span class="hint">Для приглашений на отраслевые и клиентские мероприятия</span></div><div style="margin-top:14px">${personList(ps)}</div></section>`}function analyticsView(){let byDep={},byStance={};db.people.forEach(p=>{byDep[p.department||'Другое']=(byDep[p.department||'Другое']||0)+1;byStance[p.stance||'unknown']=(byStance[p.stance||'unknown']||0)+1});let bars=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><b style="font-size:13px">${esc(k)}</b><span class="small">${n}</span></div><div class="statline"><i style="width:${n/Math.max(...Object.values(o))*100}%"></i></div></div>`).join('');return `<div class="grid">${stats()}</div><div class="split"><section class="panel"><h2>Контакты по подразделениям</h2>${bars(byDep)}</section><section class="panel"><h2>Отношение к сотрудничеству</h2>${bars({'Сторонники':byStance.positive||0,'Нейтральные':byStance.neutral||0,'Возражают':byStance.negative||0,'Не определено':byStance.unknown||0})}<div class="divider"></div><h2>Актуализация данных</h2><p class="hint">Встречи: ${db.meetings.length}. История взаимодействий: ${db.interactions.length}. Сведения, добавленные через ассистента, учитываются в этих показателях.</p></section></div>`}function dataView(){return `<section class="panel"><h2>Управление данными</h2><p class="hint">Встроенная демонстрационная база уже загружена. Импорт поддерживает как плоскую структуру companies/people/links/meetings, так и вложенные массивы компаний. Объединение происходит по ID без удаления имеющихся данных.</p><div class="grid">${stats()}</div><div class="row" style="margin-top:18px"><button class="btn" data-action="export">Экспортировать JSON</button><label class="btn secondary" for="importFile" style="cursor:pointer">Импортировать JSON</label><input type="file" id="importFile" accept=".json,application/json" class="hidden"><button class="btn danger" data-action="reset">Восстановить демонстрационную базу</button></div><div id="importMessage" class="hint" style="margin-top:13px"></div><div class="divider"></div><div class="notice warn">Данные хранятся в браузере на этом устройстве. GitHub Pages не синхронизирует их между участниками команды. Перед сбросом или сменой устройства экспортируйте JSON.</div></section>`}function render(){if(!db.companies.some(c=>c.id===companyId))companyId=db.companies[0]?.id;if(selectedId&&!db.people.some(p=>p.id===selectedId&&p.company_id===companyId))selectedId=null;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let titles={overview:'Обзор клиентской базы',map:'Карта ЛПР и влияния',assistant:'AI-ассистент после встречи',contacts:'Карточки и история',marketing:'Маркетинговые коммуникации',analytics:'Аналитика отношений',data:'База и интеграция'};el('pageTitle').textContent=titles[view];el('content').innerHTML=({overview, map:mapView,assistant:assistantView,contacts:contactsView,marketing:marketingView,analytics:analyticsView,data:dataView}[view])()}function navigate(v){view=v;search='';depFilter='';stanceFilter='';draft=null;render();window.scrollTo({top:0,behavior:'smooth'})}function editPerson(){let p=selected();if(!p)return;let fields=[['name','ФИО'],['role','Должность'],['department','Подразделение'],['influence','Влияние 1–5'],['work_priority','Интересы / приоритеты'],['approach','Подход к коммуникации'],['notes','Заметки']];let html=`<div class="panel"><h2>Редактирование · ${esc(p.name)}</h2>${fields.map(([k,label])=>`<label class="small" style="display:block;margin:10px 0 4px">${label}</label><input class="field" data-edit="${k}" value="${esc(p[k]??'')}">`).join('')}<label class="small" style="display:block;margin:10px 0 4px">Отношение</label><select class="field" id="editStance">${[['unknown','Не определено'],['neutral','Нейтрально'],['positive','Сторонник'],['negative','Возражает']].map(([v,l])=>`<option value="${v}" ${p.stance===v?'selected':''}>${l}</option>`).join('')}</select><div class="row" style="margin-top:15px"><button class="btn" data-action="saveEdit">Сохранить</button><button class="btn secondary" data-action="cancelEdit">Отмена</button></div></div>`;el('content').insertAdjacentHTML('afterbegin',`<div id="editor">${html}</div>`);el('editor').scrollIntoView({behavior:'smooth'})}function importJson(obj){if(!obj||!Array.isArray(obj.companies))throw Error('Не найден массив companies');let flat={companies:obj.companies,people:Array.isArray(obj.people)?obj.people:[],links:Array.isArray(obj.links)?obj.links:[],meetings:Array.isArray(obj.meetings)?obj.meetings:[],interactions:Array.isArray(obj.interactions)?obj.interactions:[],tasks:Array.isArray(obj.tasks)?obj.tasks:[]};for(let c of obj.companies){if(Array.isArray(c.people))for(let p of c.people)flat.people.push({...p,company_id:p.company_id||c.id});if(Array.isArray(c.edges))for(let e of c.edges)flat.links.push({...e,company_id:e.company_id||c.id});if(Array.isArray(c.events))for(let e of c.events)flat.interactions.push({...e,company_id:e.company_id||c.id})}let counts={};for(let k of Object.keys(flat)){let ids=new Set(db[k].map(x=>x.id));let n=0;for(let x of flat[k]){if(!x||!x.id)continue;if(!ids.has(x.id)){db[k].push(x);ids.add(x.id);n++}}counts[k]=n}for(let m of flat.meetings){let id='int_'+m.id;if(!db.interactions.some(x=>x.id===id)){db.interactions.push({id,company_id:m.company_id,person_id:m.person_id,date:m.date,notes:m.notes,type:'Встреча',next:m.next||''})}}save();return counts}document.addEventListener('click',e=>{let b=e.target.closest('[data-view],[data-viewto],[data-person],[data-node],[data-company],[data-action]');if(!b)return;if(b.dataset.view){navigate(b.dataset.view);return}if(b.dataset.viewto){navigate(b.dataset.viewto);return}if(b.dataset.company){companyId=b.dataset.company;selectedId=null;navigate('map');return}if(b.dataset.person||b.dataset.node){selectedId=b.dataset.person||b.dataset.node;render();return}let a=b.dataset.action;if(a==='openAssistant'){navigate('assistant')}else if(a==='editPerson')editPerson();else if(a==='cancelEdit')el('editor')?.remove();else if(a==='saveEdit'){let p=selected();if(!p)return;document.querySelectorAll('[data-edit]').forEach(x=>{let v=x.value;p[x.dataset.edit]=x.dataset.edit==='influence'?(v?Math.max(1,Math.min(5,Number(v))):null):v});p.stance=el('editStance').value;save();render()}else if(a==='example'){el('meetingPerson').value=people()[1]?.id||'';el('meetingNotes').value='Обсудили запуск пилотного проекта. Отношение: положительное. Влияние: 5. Интерес: модернизация облачной инфраструктуры. Канал: электронная почта. Следующий шаг: подготовить коммерческое предложение.'}else if(a==='analyze')analyze();else if(a==='confirm')confirmDraft();else if(a==='discard'){draft=null;render()}else if(a==='copyAudience'){let t=people().filter(p=>!marketingDepartment||p.department===marketingDepartment).map(p=>`${p.name} — ${p.role}`).join('\n');navigator.clipboard?.writeText(t).then(()=>alert('Список скопирован')).catch(()=>prompt('Скопируйте список:',t))}else if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CROC_Connect_AI_export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(a==='reset'){if(confirm('Восстановить исходную демонстрационную базу? Ваши локальные изменения будут потеряны. Сначала экспортируйте JSON.')){db=clone(SEED);save();companyId=db.companies[0].id;selectedId=null;render()}}});document.addEventListener('change',async e=>{let t=e.target;if(t.id==='companySelect'){companyId=t.value;selectedId=null;search='';depFilter='';stanceFilter='';draft=null;render()}else if(t.id==='department'){depFilter=t.value;render()}else if(t.id==='stance'){stanceFilter=t.value;render()}else if(t.id==='marketingDepartment'){marketingDepartment=t.value;render()}else if(t.id==='importFile'){let f=t.files?.[0];if(!f)return;try{let c=importJson(JSON.parse(await f.text()));render();el('importMessage').textContent=`Импорт завершён. Новых компаний: ${c.companies}; сотрудников: ${c.people}; связей: ${c.links}; встреч: ${c.meetings}.`;}catch(err){el('importMessage').textContent='Ошибка импорта: '+err.message}}});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let x=el('search');x?.focus();x?.setSelectionRange(pos,pos)}});render();</script></body></html>
