<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CROC Connect AI — MVP</title><style>
:root{--bg:#f5f7f5;--panel:#fff;--ink:#20293b;--muted:#748092;--line:#e5e9e7;--lime:#c6fa4a;--purple:#7653c8;--soft:#eff6e6;--danger:#c95663;--shadow:0 14px 40px #26333a0b}body.dark{--bg:#111722;--panel:#1c2533;--ink:#f2f5f7;--muted:#a5b0bf;--line:#344053;--soft:#2b3c2a;--shadow:none}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;background:var(--lime);color:#1c2430;font-weight:700}button.secondary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--ink)}button.danger{background:#ffe6e8;color:#a52739}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px;width:100%;outline-color:var(--purple)}textarea{resize:vertical;min-height:100px}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#202b3b;color:#fff;padding:26px 15px;display:flex;flex-direction:column;gap:8px}.brand{font-size:22px;font-weight:900;letter-spacing:-.7px;padding:0 12px 20px}.brand span{color:var(--lime)}.brand small{display:block;color:#aab5c3;font-size:11px;font-weight:500;letter-spacing:1px}.nav{width:100%;text-align:left;background:transparent;color:#b9c4d0;padding:13px 14px}.nav.active{background:#3b4654;color:#fff;border-left:3px solid var(--lime)}.sidefoot{margin-top:auto;color:#abb7c3;font-size:11px;padding:10px}.main{padding:28px 32px;min-width:0;max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:22px}.top h1{margin:0;font-size:27px}.sub{color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls select{width:220px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{font-size:27px;font-weight:850}.label{font-size:12px;color:var(--muted)}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:18px 0 8px}.pill{display:inline-flex;align-items:center;background:var(--soft);border-radius:30px;padding:4px 9px;font-size:11px;font-weight:700;color:var(--ink)}.purple{background:#f1ebff;color:#6845ad}.warn{background:#fff1d7;color:#98620d}.bad{background:#ffe5e7;color:#9d3340}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.list{display:grid;gap:8px}.person{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.person:hover{border-color:var(--purple)}.avatar{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:13px;background:#e6dffc;color:#6340b4;font-weight:900}.person .meta{flex:1;min-width:0}.person b{display:block}.person small{display:block;color:var(--muted)}.graph{width:100%;height:470px;display:block;border-radius:14px;background:radial-gradient(circle at 30% 40%,#e8f5dd 0%,transparent 55%),var(--bg)}body.dark .graph{background:var(--bg)}.graph line{stroke:#9ca8ba;stroke-width:2}.graph .edge-label{font-size:10px;fill:var(--muted)}.graph .node{cursor:pointer}.graph .node circle{fill:var(--panel);stroke:var(--purple);stroke-width:2}.graph .node.selected circle{stroke:#7cae12;stroke-width:4}.graph text{fill:var(--ink);font-size:12px}.graph .role{font-size:10px;fill:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:12px;color:var(--muted);font-weight:700}.scroll{max-height:440px;overflow:auto}.timeline{border-left:2px solid var(--line);padding-left:15px;margin-left:7px}.event{margin-bottom:14px;position:relative}.event:before{content:'';position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--purple)}.event small{color:var(--muted)}.chat{height:300px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--bg);border-radius:13px;margin-bottom:12px}.bubble{max-width:90%;background:var(--panel);padding:11px;border-radius:12px;border:1px solid var(--line);white-space:pre-wrap}.bubble.me{align-self:flex-end;background:var(--soft)}.proposal{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px}.proposal .row{margin-top:8px}.notice{padding:12px;border-radius:12px;background:var(--soft);margin:12px 0;font-size:12px}.empty{color:var(--muted);text-align:center;padding:35px 10px}.tiny{font-size:11px;color:var(--muted)}.tag{font-size:11px;color:var(--purple);font-weight:700}.foot{font-size:11px;color:var(--muted);margin-top:24px;text-align:right}.hide{display:none!important}a{color:var(--purple)}@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{flex-direction:row;align-items:center;overflow:auto;padding:10px}.brand{padding:5px;white-space:nowrap;font-size:17px}.brand small,.sidefoot{display:none}.nav{white-space:nowrap;width:auto}.main{padding:15px}.grid,.cards{grid-template-columns:1fr}.graph{height:350px}}@media(max-width:560px){.two{grid-template-columns:1fr}.top h1{font-size:22px}.controls select{width:100%}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">КРОК<span> / Connect AI</span><small>КАРТА ЛПР И ЗНАНИЙ</small></div><button class="nav active" data-page="map">◈ Карта клиента</button><button class="nav" data-page="people">♙ Контакты</button><button class="nav" data-page="meetings">✦ После встречи</button><button class="nav" data-page="marketing">✉ Маркетинг</button><button class="nav" data-page="analytics">▥ Аналитика</button><button class="nav" data-page="data">⇄ Данные и CRM</button><div class="sidefoot">Демо-MVP · локальное хранение<br>Команда «КРОКодил Гена»</div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Карта клиента</h1><div class="sub" id="pageSub">Люди, решения, отношения и история взаимодействий</div></div><div class="controls"><select id="company"></select><button class="secondary" id="theme">◐ Тема</button><button class="secondary" id="reset">↻ Сброс демо</button></div></div><div id="view"></div><div class="foot">КРОКодил Гена · Демонстрационные данные · CRM и ИИ API не подключены</div></main></div>
<script>
'use strict';
const KEY='croc-connect-mvp-v3';
const names=['ПромТех','СеверЭнерго','АльфаЛогистика','НоваФинанс','ГородТелеком','МегаРитейл','ВостокМеталл','ГлобалМед','ИнфраСтрой','ТехноПарк','ЭкоПром'];
const first=['Алексей','Мария','Игорь','Анна','Дмитрий','Елена','Сергей','Ольга'];const last=['Соколов','Морозова','Кузнецов','Петрова','Волков','Смирнова','Орлов','Фёдорова'];
const roles=['ИТ-директор','Финансовый директор','Руководитель ИБ','Директор по закупкам','Архитектор решений','Руководитель инфраструктуры','Директор по развитию','Руководитель проектов'];
const deps=['ИТ','Финансы','ИБ','Закупки','ИТ','ИТ','Бизнес','Проекты'];const interests=['Облачная инфраструктура','Экономика проекта','Кибербезопасность','Условия закупки','Архитектура','Импортозамещение','Цифровая трансформация','Управление проектами'];
function seed(){return {companies:names.map((n,j)=>({id:'c'+j,name:n,people:roles.map((role,i)=>({id:'c'+j+'p'+i,name:first[(i+j)%8]+' '+last[(i+j)%8],role,department:deps[i],decision:['ЛПР','Влияет','Эксперт','Согласует','Эксперт','Влияет','ЛПР','Пользователь'][i],relation:['Сильные','Средние','Нет контакта','Средние','Слабые','Средние','Слабые','Нет контакта'][i],interest:interests[i],channel:['Почта','Телефон','Мессенджер'][i%3],notes:i===0?'Ключевой контакт по ИТ-инициативам.':'',updated:'2026-11-20',source:'Демо CRM',verified:true})),edges:[{a:0,b:1,type:'Согласование бюджета'},{a:0,b:2,type:'Техническая оценка'},{a:0,b:4,type:'Экспертиза'},{a:0,b:5,type:'Взаимодействие'},{a:1,b:3,type:'Согласование закупки'},{a:6,b:0,type:'Влияние на стратегию'},{a:4,b:7,type:'Рабочая связь'}],events:[{id:'e'+j,person:0,date:'2026-11-18',text:'Обсудили планы модернизации инфраструктуры и следующий технический созвон.',source:'Демо CRM'}]})),audit:[],drafts:[],messages:[],theme:'light'}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}let page='map',current=0,selected=0,filter='',search='',draftText='';
const $=id=>document.getElementById(id),c=()=>state.companies[current],esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function log(type,detail){state.audit.unshift({date:new Date().toLocaleString('ru-RU'),company:c().name,type,detail});save()}
function options(vals,value){return vals.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')};function badge(t){return `<span class="pill ${t==='Нет контакта'?'bad':t==='Слабые'?'warn':''}">${esc(t)}</span>`}
function init(){document.body.classList.toggle('dark',state.theme==='dark');$('company').innerHTML=state.companies.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('');$('company').value=current;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
function setPage(p){page=p;selected=0;search='';filter='';init()};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('company').onchange=e=>{current=+e.target.value;selected=0;render()};$('theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();init()};$('reset').onclick=()=>{if(confirm('Удалить локальные изменения и восстановить демонстрационные данные?')){state=seed();current=0;save();init()}};
const titles={map:['Карта клиента','Организационные и рабочие связи, роли и влияние'],people:['Контакты','Карточки, редактирование, история и источники'],meetings:['После встречи','Ввод сведений, проверка и обновление знаний'],marketing:['Маркетинг','Поиск релевантной аудитории мероприятий'],analytics:['Аналитика','Охват, актуальность и риски отношений'],data:['Данные и CRM','Демонстрация импорта, экспорта и истории изменений']};
function render(){ $('pageTitle').textContent=titles[page][0];$('pageSub').textContent=titles[page][1];$('view').innerHTML=({map:mapView,people:peopleView,meetings:meetingsView,marketing:marketingView,analytics:analyticsView,data:dataView})[page]();wire()}
function graph(){const ps=c().people;const W=800,H=440;const pos=ps.map((_,i)=>({x:400+285*Math.cos((i*2*Math.PI/ps.length)-Math.PI/2),y:220+163*Math.sin((i*2*Math.PI/ps.length)-Math.PI/2)}));let s=`<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Карта связей сотрудников">`;for(const e of c().edges){const a=pos[e.a],b=pos[e.b];if(!a||!b)continue;s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><text class="edge-label" x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-6}" text-anchor="middle">${esc(e.type)}</text>`}ps.forEach((p,i)=>{if(filter&&p.department!==filter)return;const z=pos[i];s+=`<g class="node ${i===selected?'selected':''}" data-person="${i}"><circle cx="${z.x}" cy="${z.y}" r="37"/><text x="${z.x}" y="${z.y-4}" text-anchor="middle" font-weight="bold">${esc(p.name.split(' ')[0])}</text><text class="role" x="${z.x}" y="${z.y+12}" text-anchor="middle">${esc(p.role.length>19?p.role.slice(0,17)+'…':p.role)}</text></g>`});return s+'</svg>'}
function profile(p){if(!p)return '<div class="empty">Выберите сотрудника</div>';return `<div class="row between"><h2>${esc(p.name)}</h2>${badge(p.relation)}</div><div class="list"><div><span class="label">Должность / отдел</span><br><b>${esc(p.role)} · ${esc(p.department)}</b></div><div><span class="label">Роль в решении</span><br>${badge(p.decision)}</div><div><span class="label">Профессиональные интересы</span><br>${esc(p.interest)}</div><div><span class="label">Предпочтительный канал</span><br>${esc(p.channel)}</div><div><span class="label">Заметки</span><br>${esc(p.notes||'Нет данных')}</div><div class="tiny">Источник: ${esc(p.source)} · Обновлено: ${esc(p.updated)} ${p.verified?'· подтверждено':'· требует проверки'}</div></div><div class="row" style="margin-top:16px"><button onclick="editPerson(${selected})">Редактировать</button><button class="secondary" onclick="setPage('people')">Все контакты</button></div>`}
function mapView(){const ps=c().people;return `<div class="cards" style="margin-bottom:16px"><div class="panel"><div class="label">Сотрудников на карте</div><div class="metric">${ps.length}</div></div><div class="panel"><div class="label">Рабочих связей</div><div class="metric">${c().edges.length}</div></div><div class="panel"><div class="label">Ключевых участников (ЛПР и влияющих)</div><div class="metric">${ps.filter(p=>['ЛПР','Влияет'].includes(p.decision)).length}</div></div></div><div class="grid"><div class="panel"><div class="row between"><h2>Карта влияния · ${esc(c().name)}</h2><select style="width:180px" id="deptFilter"><option value="">Все отделы</option>${[...new Set(ps.map(p=>p.department))].map(d=>`<option ${filter===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div>${graph()}<div class="tiny">Нажмите на узел, чтобы открыть карточку. Линии отражают демонстрационные подтверждённые рабочие связи, не личные отношения.</div></div><div class="panel">${profile(ps[selected])}<h3>Недавние взаимодействия</h3>${c().events.slice(0,3).map(e=>`<div class="event"><small>${esc(e.date)}</small><div>${esc(e.text)}</div></div>`).join('')||'<p class="muted">Нет записей</p>'}</div></div>`}
function peopleView(){let ps=c().people.map((p,i)=>({p,i})).filter(({p})=>(p.name+' '+p.role+' '+p.interest).toLowerCase().includes(search.toLowerCase()));return `<div class="grid"><div class="panel"><div class="row between"><h2>Сотрудники компании</h2><button onclick="addPerson()">+ Добавить</button></div><input id="personSearch" placeholder="Поиск по имени, роли или интересам" value="${esc(search)}"><div class="list scroll" style="margin-top:12px">${ps.map(({p,i})=>`<div class="person" data-person="${i}"><span class="avatar">${esc(p.name.split(' ').map(x=>x[0]).join(''))}</span><span class="meta"><b>${esc(p.name)}</b><small>${esc(p.role)} · ${esc(p.department)}</small></span>${badge(p.decision)}</div>`).join('')||'<div class="empty">Ничего не найдено</div>'}</div></div><div class="panel">${profile(c().people[selected])}<h3>История взаимодействий</h3><div class="timeline">${c().events.filter(e=>e.person===selected).map(e=>`<div class="event"><small>${esc(e.date)} · ${esc(e.source)}</small><div>${esc(e.text)}</div></div>`).join('')||'<div class="muted">Записей пока нет</div>'}</div></div></div>`}
function meetingsView(){const drafts=state.drafts.filter(d=>d.company===c().id);return `<div class="grid"><div class="panel"><h2>Чат: сведения после встречи</h2><p class="sub">Введите полученную информацию. Демо-анализ извлекает факты по явным формулировкам; он не является подключённой LLM.</p><div class="chat">${state.messages.filter(m=>m.company===c().id).slice(-15).map(m=>`<div class="bubble ${m.who==='user'?'me':''}"><div class="tiny">${m.who==='user'?'Сотрудник':'CROC Connect AI · демо-анализ'}</div>${esc(m.text)}</div>`).join('')||'<div class="empty">После переговоров внесите сюда полученные сведения о клиенте и ходе взаимодействия.</div>'}</div><div class="field"><label>С кем была встреча</label><select id="meetPerson">${c().people.map((p,i)=>`<option value="${i}">${esc(p.name)} · ${esc(p.role)}</option>`).join('')}</select></div><textarea id="meetingText" placeholder="Например: Обсудили модернизацию инфраструктуры. Интерес: облачные сервисы. Канал: почта. Роль в решении: влияет. Следующая встреча: 30 ноября."></textarea><div class="row"><button id="analyze">Анализировать запись</button><span class="tiny">Ничего не меняется без подтверждения</span></div></div><div class="panel"><h2>Предложения к обновлению</h2><div class="notice">После анализа сотрудник проверяет каждое изменение. Исходный текст встречи сохраняется в истории.</div>${drafts.map(d=>`<div class="proposal"><span class="tag">${esc(d.kind==='event'?'История взаимодействий':'Обновление карточки')}</span><div><b>${esc(d.label)}</b></div><div>${esc(d.value)}</div><div class="tiny">${esc(d.source)} · ${esc(d.date)}</div><div class="row"><button onclick="approve('${d.id}')">Подтвердить</button><button class="secondary" onclick="reject('${d.id}')">Отклонить</button></div></div>`).join('')||'<div class="empty">Пока нет предложений. Введите сведения слева.</div>'}</div></div>`}
function marketingView(){const ps=c().people;return `<div class="grid"><div class="panel"><h2>Подбор аудитории мероприятия</h2><p class="sub">Фильтрация по известным деловым интересам и ролям; приглашения автоматически не отправляются.</p><div class="field"><label>Тема мероприятия</label><select id="topic"><option value="">Все направления</option>${[...new Set(ps.map(p=>p.interest))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Роль в принятии решений</label><select id="roleSelect"><option value="">Все роли</option>${[...new Set(ps.map(p=>p.decision))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><button id="selectAudience">Подобрать контакты</button><div id="audience" style="margin-top:14px"></div></div><div class="panel"><h2>Что получает маркетолог</h2><div class="list"><div class="notice">✓ Подбор по подтверждённым профессиональным интересам</div><div class="notice">✓ Видимость каналов общения и истории взаимодействий</div><div class="notice">✓ Исключение нерелевантных контактов</div><div class="notice">✓ Экспорт списка для последующей проверки</div></div></div></div>`}
function analyticsView(){const ps=c().people;let fresh=ps.filter(p=>Date.now()-new Date(p.updated).getTime()<1000*3600*24*90).length;let key=ps.filter(p=>['ЛПР','Влияет'].includes(p.decision));let known=key.filter(p=>p.relation!=='Нет контакта').length;return `<div class="cards"><div class="panel"><div class="label">Охват ключевых участников</div><div class="metric">${known}/${key.length}</div><div class="sub">Есть хотя бы отмеченные отношения</div></div><div class="panel"><div class="label">Актуальные карточки (90 дней)</div><div class="metric">${fresh}/${ps.length}</div><div class="sub">По дате последнего обновления</div></div><div class="panel"><div class="label">Зафиксировано взаимодействий</div><div class="metric">${c().events.length}</div><div class="sub">В демо-базе клиента</div></div></div><div class="grid" style="margin-top:18px"><div class="panel"><h2>Пробелы и риски</h2><div class="list">${ps.filter(p=>p.relation==='Нет контакта'||!p.verified).map(p=>`<div class="person"><span class="avatar">!</span><span class="meta"><b>${esc(p.name)}</b><small>${esc(p.role)} · ${p.verified?'Нет контакта':'Данные требуют проверки'}</small></span></div>`).join('')||'<div class="notice">Критических пробелов по выбранным признакам не обнаружено</div>'}</div></div><div class="panel"><h2>Принципы измерения</h2><p>Показатели вычисляются из текущих демонстрационных записей. Это не реальные KPI КРОК и не доказательство роста продаж.</p><div class="notice">Охват = ключевые участники, для которых зафиксированы отношения / все отмеченные ключевые участники.</div><div class="notice">Актуальность = карточки, обновлённые за последние 90 дней / все карточки.</div></div></div>`}
function dataView(){return `<div class="grid"><div class="panel"><h2>Обмен данными</h2><p>В демонстрации CRM имитируется импортом JSON. Изменения сохраняются в localStorage этого браузера, а не в корпоративной системе.</p><div class="notice"><b>CRM → CROC Connect AI:</b> компании, люди, должности и контакты.<br><b>Внутри карты:</b> влияние, интересы, заметки, встречи и проверки.<br><b>CROC Connect AI → CRM:</b> подготовленный JSON-экспорт изменений для будущей интеграции.</div><div class="row"><button onclick="exportData()">Экспорт JSON</button><button class="secondary" onclick="$('fileImport').click()">Импорт JSON (объединение)</button><input type="file" accept=".json,application/json" id="fileImport" style="display:none"></div><h3>Формат импорта</h3><pre style="white-space:pre-wrap;font-size:11px;background:var(--bg);padding:12px;border-radius:10px">{"companies":[{"id":"c0","name":"ПромТех","people":[{"id":"c0p0","name":"...","role":"..."}],"edges":[],"events":[]}]}</pre></div><div class="panel"><h2>Журнал изменений</h2><div class="scroll timeline">${state.audit.slice(0,30).map(x=>`<div class="event"><small>${esc(x.date)} · ${esc(x.company)}</small><div><b>${esc(x.type)}</b>: ${esc(x.detail)}</div></div>`).join('')||'<div class="empty">Пока нет изменений</div>'}</div></div></div>`}
function wire(){document.querySelectorAll('[data-person]').forEach(el=>el.onclick=()=>{selected=+el.dataset.person;render()});const f=$('deptFilter');if(f)f.onchange=e=>{filter=e.target.value;render()};const s=$('personSearch');if(s)s.oninput=e=>{search=e.target.value;const pos=s.selectionStart;render();$('personSearch').focus();$('personSearch').setSelectionRange(pos,pos)};const a=$('analyze');if(a)a.onclick=analyze;const au=$('selectAudience');if(au)au.onclick=audience;const fi=$('fileImport');if(fi)fi.onchange=importData}
function editPerson(i){const p=c().people[i];let box=document.createElement('div');box.className='panel';box.style='position:fixed;z-index:20;top:6vh;left:50%;transform:translateX(-50%);width:min(540px,94vw);max-height:90vh;overflow:auto;box-shadow:0 0 0 100vmax #0008';box.innerHTML=`<div class="row between"><h2>Редактирование контакта</h2><button class="secondary" id="closeModal">×</button></div><div class="two">${[['name','Имя'],['role','Должность'],['department','Отдел'],['interest','Интересы'],['channel','Канал'],['source','Источник']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-key="${k}" value="${esc(p[k])}"></div>`).join('')}</div><div class="two"><div class="field"><label>Роль в решении</label><select data-key="decision">${options(['ЛПР','Влияет','Эксперт','Согласует','Пользователь'],p.decision)}</select></div><div class="field"><label>Отношения</label><select data-key="relation">${options(['Сильные','Средние','Слабые','Нет контакта'],p.relation)}</select></div></div><div class="field"><label>Заметки</label><textarea data-key="notes">${esc(p.notes)}</textarea></div><div class="row"><button id="savePerson">Сохранить</button><label class="tiny"><input type="checkbox" id="verified" style="width:auto" ${p.verified?'checked':''}> Подтверждено сотрудником</label></div>`;document.body.appendChild(box);box.querySelector('#closeModal').onclick=()=>box.remove();box.querySelector('#savePerson').onclick=()=>{box.querySelectorAll('[data-key]').forEach(x=>p[x.dataset.key]=x.value);p.verified=box.querySelector('#verified').checked;p.updated=new Date().toISOString().slice(0,10);log('Карточка','Изменён контакт '+p.name);box.remove();render()}}
function addPerson(){const p={id:c().id+'p'+Date.now(),name:'Новый контакт',role:'Не указана',department:'Не указан',decision:'Эксперт',relation:'Нет контакта',interest:'Не указан',channel:'Почта',notes:'',source:'Ввод сотрудника',updated:new Date().toISOString().slice(0,10),verified:false};c().people.push(p);selected=c().people.length-1;log('Новый контакт',p.name);render();editPerson(selected)}
function analyze(){const text=$('meetingText').value.trim();if(text.length<12){alert('Введите содержательную запись о встрече (не менее 12 символов).');return}const i=+$('meetPerson').value,p=c().people[i],id='d'+Date.now(),date=new Date().toISOString().slice(0,10);state.messages.push({company:c().id,who:'user',text});const proposals=[{id:id+'e',kind:'event',label:'Добавить запись в историю',value:text,person:i,company:c().id,source:'Запись сотрудника · требует подтверждения',date}];const patterns=[['interest',/(?:интерес|интересует|тема)\s*[:—-]\s*([^.!\n]+)/i,'Профессиональный интерес'],['channel',/(?:канал|связь|связываться)\s*[:—-]\s*([^.!\n]+)/i,'Предпочтительный канал'],['decision',/(?:роль в решении|роль)\s*[:—-]\s*([^.!\n]+)/i,'Роль в принятии решения'],['relation',/(?:отношения|статус контакта)\s*[:—-]\s*([^.!\n]+)/i,'Оценка отношений'],['notes',/(?:заметка|важно)\s*[:—-]\s*([^.!\n]+)/i,'Дополнительная заметка']];for(const [field,regex,label] of patterns){const m=text.match(regex);if(m){let val=m[1].trim();if(field==='decision'){let found=['ЛПР','Влияет','Эксперт','Согласует','Пользователь'].find(x=>x.toLowerCase()===val.toLowerCase());if(!found)continue;val=found}if(field==='relation'){let found=['Сильные','Средние','Слабые','Нет контакта'].find(x=>x.toLowerCase()===val.toLowerCase());if(!found)continue;val=found}if(val&&p[field]!==val&&!proposals.some(d=>d.field===field))proposals.push({id:id+field,kind:'field',label,field,value:val,person:i,company:c().id,source:'Правило извлечения · проверка сотрудником',date})}}state.drafts.push(...proposals);state.messages.push({company:c().id,who:'system',text:`Демо-анализ завершён: ${proposals.length} предложений, включая запись в историю. Проверьте каждое изменение справа. Неоднозначные сведения автоматически не меняются.`});log('Анализ записи','Сформировано предложений: '+proposals.length);render()}
function approve(id){const d=state.drafts.find(x=>x.id===id);if(!d)return;const p=c().people[d.person];if(d.kind==='event'){c().events.unshift({id:'e'+Date.now(),person:d.person,date:d.date,text:d.value,source:'Подтверждено сотрудником'})}else{p[d.field]=d.field==='notes'?[p.notes,d.value].filter(Boolean).join(' | '):d.value;p.updated=d.date;p.source='Запись встречи · подтверждено';p.verified=true}state.drafts=state.drafts.filter(x=>x.id!==id);log('Подтверждено',d.label+' · '+p.name);render()}
function reject(id){const d=state.drafts.find(x=>x.id===id);if(!d)return;state.drafts=state.drafts.filter(x=>x.id!==id);log('Отклонено',d.label);render()}
let audienceCsv='';function audience(){const t=$('topic').value,r=$('roleSelect').value;const ps=c().people.filter(p=>(!t||p.interest===t)&&(!r||p.decision===r));audienceCsv='Имя;Должность;Интерес;Канал\n'+ps.map(p=>[p.name,p.role,p.interest,p.channel].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n');$('audience').innerHTML=`<h3>Подобрано: ${ps.length}</h3><div class="list">${ps.map(p=>`<div class="person"><span class="avatar">${esc(p.name[0])}</span><span class="meta"><b>${esc(p.name)}</b><small>${esc(p.role)} · ${esc(p.interest)} · ${esc(p.channel)}</small></span></div>`).join('')||'<div class="empty">Нет подходящих контактов</div>'}</div><button class="secondary" style="margin-top:12px" onclick="download('audience.csv',audienceCsv,'text/csv;charset=utf-8')">Скачать CSV</button>`}

function download(name,text,type='application/json'){let blob=new Blob(['\ufeff',text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportData(){download('croc-connect-export.json',JSON.stringify({exportedAt:new Date().toISOString(),companies:state.companies,audit:state.audit},null,2));log('Экспорт','Подготовлен JSON-файл')}
async function importData(e){const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.companies))throw Error('Ожидается массив companies');let count=0;for(const inc of data.companies){if(!inc.id||!inc.name)continue;let dst=state.companies.find(x=>x.id===inc.id||x.name===inc.name);if(!dst){dst={id:inc.id,name:inc.name,people:[],edges:[],events:[]};state.companies.push(dst)}for(const key of ['people','edges','events'])if(Array.isArray(inc[key]))for(const obj of inc[key]){const k=key==='edges'?'a': 'id';let at=dst[key].findIndex(x=>x[k]===obj[k]&&(key!=='edges'||x.b===obj.b));if(at>=0)dst[key][at]={...dst[key][at],...obj};else dst[key].push(obj);count++}}log('Импорт','Объединено записей: '+count);init();alert('Импорт выполнен: '+count+' записей. Существующие компании не удалены.')}catch(err){alert('Ошибка импорта: '+err.message)}}
init();
</script></body></html>
