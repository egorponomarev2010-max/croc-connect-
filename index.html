const INITIAL={"companies": [{"id": "akson", "name": "Аксон Нейротех"}], "people": [{"id": "akson_1", "company_id": "akson", "name": "Громов Виктор Андреевич", "role": "Генеральный директор (CEO)", "department": "Руководство", "level": "Руководитель", "age": 54, "eye_color": "серые", "interests": "парусный спорт, история науки, коллекция виниловых пластинок", "work_priority": "Довести первый имплантат до регистрации и не потерять доверие инвесторов, врачей и пациентов. Для него главное — предсказуемость и отсутствие неприятных сюрпризов.", "approach": "Обращаться «Виктор Андреевич», на «Вы». Первая фраза — вывод и то, что нужно от него. Укладываться в 10 минут. Предлагать два варианта и свою рекомендацию.", "influence": null, "stance": "unknown", "contact": null, "last_contact": "", "notes": "", "internal": false, "leader_details": {"Как обратиться": "Обращаться «Виктор Андреевич», на «Вы». Первая фраза — вывод и то, что нужно от него. Укладываться в 10 минут. Предлагать два варианта и свою рекомендацию.", "Как подготовить данные": "Одна страница: цель, три ключевые цифры, риски по принципу светофора, срок и решение, которое требуется. Подробности — в приложении, отдельно.", "Чего избегать": "Жаргон без расшифровки, проблемы без предложенного решения, плохие новости в последний момент."}}, {"id": "akson_2", "company_id": "akson", "name": "Лазарева Ирина Валерьевна", "role": "Финансовый директор (CFO)", "department": "Финансы и экономика", "level": "Руководитель", "age": 49, "eye_color": "карие", "interests": "шахматы, бег, книги по истории финансов", "work_priority": "Удерживать себестоимость чипа и расходы на испытания в рамках бюджета, сокращать срок окупаемости. Её ключевые показатели — цена за единицу и денежный поток; цена не должна быть слишком высокой.", "approach": "«Ирина Валерьевна», строго по делу. Начинать с суммы и срока окупаемости, сразу показывать, чем это дешевле альтернативы. Просьбу о деньгах строить так: сначала что сэкономим или заработаем, потом сколько это стоит.", "influence": null, "stance": "unknown", "contact": null, "last_contact": "", "notes": "", "internal": false, "leader_details": {"Как обратиться": "«Ирина Валерьевна», строго по делу. Начинать с суммы и срока окупаемости, сразу показывать, чем это дешевле альтернативы. Просьбу о деньгах строить так: сначала что сэкономим или заработаем, потом сколько это стоит.", "Как подготовить данные": "Таблица «затраты — эффект — срок окупаемости». Три сценария (базовый, оптимистичный, пессимистичный), чувствительность к цене, список допущений, итоговая строка. Все суммы с источниками.", "Чего избегать": "Слова «примерно» и «около», расходы без источника, скрытые дополнительные затраты в конце презентации."}}, {"id": "akson_3", "company_id": "akson", "name": "Бережной Олег Станиславович", "role": "Операционный директор (COO)", "department": "Руководство", "level": "Руководитель", "age": 52, "eye_color": "карие", "interests": "рыбалка, ремонт мотоциклов, военная история", "work_priority": "Стабильный выпуск партий чипов без брака и срыва сроков; загрузка мощностей и выполнение плана.", "approach": "«Олег Станиславович», коротко и по фактам. Говорить на языке сроков и мощностей. Приходить с готовым решением и запасным вариантом.", "influence": null, "stance": "unknown", "contact": null, "last_contact": "", "notes": "", "internal": false, "leader_details": {"Как обратиться": "«Олег Станиславович», коротко и по фактам. Говорить на языке сроков и мощностей. Приходить с готовым решением и запасным вариантом.", "Как подготовить данные": "График, узкие места, загрузка мощностей, процент брака, план Б. Цифры за последние 3 месяца.", "Чего избегать": "Общие слова, перекладывание ответственности, обещания без дат."}}, {"id": "akson_4", "company_id": "akson", "name": "Ткаченко Артём Игоревич", "role": "Технический директор (CTO)", "department": "Разработка", "level": "Руководитель", "age": 43, "eye_color": "зелёные", "interests": "радиолюбительство, настольные игры, го function savePersonEdit(){let p=getp(selected);p.contact=$('edcontact').value;p.stance=$('edstance').value;p.last_contact=$('edlast').value;p.work_priority=$('edpriority').value;p.interests=$('edinterests').value;p.notes=$('ednotes').value;save();render()}
function renderPeople(){return `<section class="panel"><div class="sectionbar"><h2>Все сотрудники · ${people().length}</h2><input class="search" style="max-width:360px" placeholder="Имя, должность, интересы..." value="${esc(query)}" oninput="query=this.value;renderPeopleList()"></div><div id="peoplelist" class="departments">${peopleList()}</div></section>`}
function peopleList(){return people().filter(matches).map(p=>`<div class="dept" style="padding:12px"><div style="display:flex;gap:10px;align-items:center"><span class="avatar">${esc(initials(p.name))}</span><div><strong>${esc(p.name)}</strong><div class="muted" style="font-size:12px">${esc(p.role)} · ${esc(p.department)}</div></div></div><div class="formactions"><button class="btn" onclick="selected='${esc(p.id)}';view='tree';render()">Карточка →</button><button class="btn" onclick="startMeeting('${esc(p.id)}')">＋ Встреча</button></div></div>`).join('')||'<div class="empty">Ничего не найдено</div>'}
function renderPeopleList(){$('peoplelist').innerHTML=peopleList()}
function startMeeting(id){meetingPerson=id;view='meetings';render()}
function renderMeetings(){let pp=people();let p=meetingPerson||selected||pp[0]?.id;return `<div class="two"><section class="panel"><h2>Анкета после переговоров</h2><div class="notice">Записывайте рабочие договорённости и добровольно сообщённые уместные интересы. Не фиксируйте сведения о семье, здоровье или эмоциональных уязвимостях для влияния на человека.</div><div class="formgrid"><label class="full">Сотрудник<select id="mperson" class="search">${pp.map(x=>`<option value="${esc(x.id)}" ${x.id===p?'selected':''}>${esc(x.name)} — ${esc(x.role)}</option>`).join('')}</select></label><label>Дата<input type="date" id="mdate" class="search" value="${date()}"></label><label>Итог<select id="moutcome" class="search"><option value="нейтрально">Нейтрально</option><option value="положительно">Положительно</option><option value="возражения">Есть возражения</option></select></label><label class="full">Сводка встречи<textarea id="mnotes" class="search" rows="6" placeholder="Что обсуждали, какие возражения, что обещали, какие следующие шаги..."></textarea></label><label class="full">Профессиональные интересы (если уместны)<input id="minterests" class="search" placeholder="Например: отраслевые конференции"></label><label class="full">Следующий шаг<input id="mnext" class="search" placeholder="Например: отправить расчёт окупаемости"></label></div><div class="formactions"><button class="btn primary" onclick="submitMeeting()">Сохранить и обработать</button><button class="btn" onclick="runConsolidation()">Обновить аналитику</button></div><p class="footerhint">Автоматическая обработка в этом MVP выполняется локальными правилами, без внешней нейросети и без фонового сервера. Для реального запуска в 01:00 потребуется серверный планировщик.</p></section><section class="panel"><h2>История встреч</h2><div class="timeline">${db.meetings.filter(m=>m.company_id===company).sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<div class="listitem"><strong>${esc(getp(m.person_id)?.name||'Контакт')} · ${esc(m.date)}</strong><small>${esc(m.notes)}</small><div class="tag">${esc(m.outcome)} · ${esc(m.next||'')}</div></div>`).join('')||'<div class="empty">Встреч пока нет. Добавьте первую анкету.</div>'}</div></section></div>`}
function submitMeeting(){let id=$('mperson').value,p=getp(id),notes=$('mnotes').value.trim(),next=$('mnext').value.trim(),interests=$('minterests').value.trim();if(!notes){alert('Добавьте сводку встречи');return}let m={id:'m'+Date.now(),person_id:id,company_id:company,date:$('mdate').value||date(),outcome:$('moutcome').value,notes,next,interests};db.meetings.push(m);db.interactions.push({id:'i'+Date.now(),person_id:id,date:m.date,type:'Встреча',notes});p.last_contact=m.date;if(m.outcome==='положительно')p.stance='positive';if(m.outcome==='возражения')p.stance='negative';if(interests)p.interests=[p.interests,interests].filter(Boolean).join('; ');if(next)db.tasks.push({id:'t'+Date.now(),company_id:company,person_id:id,title:next,status:'open',created:m.date,source:m.id});save();alert('Встреча сохранена. История, отношение и задачи обновлены.');render()}
function runConsolidation(){save();alert('Данные сохранены и аналитика обновлена. Автоматический ночной запуск требует серверной версии.');render()}
function renderTasks(){let ts=db.tasks.filter(t=>t.company_id===company);return `<section class="panel wide"><h2>Задачи по клиенту</h2>${ts.map(t=>`<div class="listitem" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><strong>${esc(t.title)}</strong><small>${esc(getp(t.person_id)?.name||'')} · ${esc(t.created)}</small></div><button class="btn" onclick="toggleTask('${esc(t.id)}')">${t.status==='done'?'↶ Вернуть':'✓ Выполнено'}</button></div>`).join('')||'<div class="empty">Задач пока нет. Добавьте следующий шаг в анкете встречи.</div>'}</section>`}
function toggleTask(id){let t=db.tasks.find(x=>x.id===id);if(t)t.status=t.status==='done'?'open':'done';save();render()}
function renderRadar(){let pp=people(),departments=[...new Set(pp.map(p=>p.department))],covered=departments.filter(d=>pp.some(p=>p.department===d&&p.last_contact)),unknown=departments.filter(d=>!covered.includes(d));let old=pp.filter(p=>p.last_contact&&((new Date()-new Date(p.last_contact))/86400000>90));let leadership=pp.filter(p=>/директор|руководитель/i.test(p.role));let noContact=leadership.filter(p=>!p.last_contact);return `<div class="two"><section class="panel"><h2>Риски отношений</h2><div class="listitem"><strong class="warn">${noContact.length} руководителей без подтверждённых контактов</strong><small>Отсутствие записей не означает отсутствие реального знакомства. Это пробел в данных.</small></div><div class="listitem"><strong class="danger">${old.length} давно не обновлявшихся контактов</strong><small>Порог: 90 дней от последней сохранённой даты.</small></div><h3>Кого стоит уточнить</h3>${noContact.slice(0,15).map(p=>`<div class="listitem"><strong>${esc(p.name)}</strong><small>${esc(p.role)} · ${esc(p.department)}</small><div class="formactions"><button class="btn" onclick="selected='${esc(p.id)}';view='tree';render()">Открыть карточку</button></div></div>`).join('')||'<div class="empty">Нет записей для проверки</div>'}</section><section class="panel"><h2>Возможности развития отношений</h2><div class="notice">Это направления для проверки, а не гарантированные коммерческие возможности.</div><div class="listitem"><strong>${covered.length} из ${departments.length} подразделений с зафиксированными контактами</strong><small>Охват считается по сохранённой истории.</small></div><h3>Неохваченные в базе подразделения</h3>${unknown.map(d=>`<div class="listitem"><strong>${esc(d)}</strong><small>${pp.filter(p=>p.department===d).length} сотрудников · нет зарегистрированных встреч</small></div>`).join('')||'<div class="empty">Все подразделения имеют записи о контактах</div>'}</section></div>`}
function renderGraph(){let pp=people(),links=db.links.filter(l=>pp.some(p=>p.id===l.from)&&pp.some(p=>p.id===l.to));let limit=pp.slice(0,28),ids=new Set(limit.map(p=>p.id));let W=900,H=430,cx=W/2,cy=H/2;let coords=Object.fromEntries(limit.map((p,i)=>[p.id,[cx+315*Math.cos(2*Math.PI*i/limit.length),cy+165*Math.sin(2*Math.PI*i/limit.length)]]));return `<div class="contentgrid"><section class="panel"><div class="sectionbar"><h2>Подтверждённые связи людей</h2><button class="btn primary" onclick="addLinkPrompt()">＋ Добавить связь</button></div><div class="notice">Граф показывает только явно сохранённые связи. Организационное соседство само по себе не подтверждает знакомство.</div><div class="graphbox"><svg viewBox="0 0 ${W} ${H}">${links.filter(l=>ids.has(l.from)&&ids.has(l.to)).map(l=>{let a=coords[l.from],b=coords[l.to];return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#61db98" stroke-opacity=".65" stroke-width="2"/>`}).join('')}${limit.map(p=>{let [x,y]=coords[p.id];return `<g class="node ${p.id===selected?'selected':''}" onclick="selected='${esc(p.id)}';render()"><rect x="${x-58}" y="${y-19}" width="116" height="38" rx="9"/><text text-anchor="middle" x="${x}" y="${y+4}">${esc(p.name.split(' ')[0])} ${esc((p.name.split(' ')[1]||'')[0]||'')}.</text></g>`}).join('')}</svg></div><p class="footerhint">Показаны первые 28 контактов для читаемости; все ${pp.length} доступны в дереве и списке.</p><h3>Маршрут знакомства</h3><div class="formgrid"><label>От кого<select id="pathfrom" class="search">${pp.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label><label>К кому<select id="pathto" class="search">${pp.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label></div><div class="formactions"><button class="btn primary" onclick="findPath()">Найти путь</button></div><div id="pathresult" class="notice" style="margin-top:10px">Маршруты строятся только по добавленным связям.</div></section><aside class="panel" id="details">${renderDetails()}</aside></div>`}
function addLinkPrompt(){let pp=people();let from=prompt('Введите точное ФИО первого человека:');if(!from)return;let to=prompt('Введите точное ФИО второго человека:');if(!to)return;let a=pp.find(p=>p.name.toLowerCase()===from.trim().toLowerCase()),b=pp.find(p=>p.name.toLowerCase()===to.trim().toLowerCase());if(!a||!b||a.id===b.id){alert('Не найдены оба человека по точному ФИО');return}if(db.links.some(l=>(l.from===a.id&&l.to===b.id)||(l.from===b.id&&l.to===a.id))){alert('Связь уже есть');return}db.links.push({id:'l'+Date.now(),from:a.id,to:b.id,type:'Подтверждённый контакт',source:'Ручное добавление'});save();render()}
function findPath(){let a=$('pathfrom').value,b=$('pathto').value,adj={};people().forEach(p=>adj[p.id]=[]);db.links.forEach(l=>{if(adj[l.from]&&adj[l.to]){adj[l.from].push(l.to);adj[l.to].push(l.from)}});let queue=[[a]],seen=new Set([a]),path=null;while(queue.length){let cur=queue.shift(),last=cur.at(-1);if(last===b){path=cur;break}for(let n of adj[last]||[])if(!seen.has(n)){seen.add(n);queue.push([...cur,n])}}$('pathresult').textContent=path?path.map(id=>getp(id)?.name).join(' → '):'Подтверждённого пути знакомства нет. Не следует его выдумывать.'}
function renderData(){return `<section class="panel wide"><h2>Управление базой данных</h2><div class="notice">Встроена исходная база «Аксон Нейротех»: ${db.people.length} сотрудников. Можно импортировать новые JSON или CSV; оригинальные поля сохраняются при JSON-экспорте. Перед заменой базы сохраните резервную копию.</div><div class="two"><div class="fact"><strong>JSON — полный обмен</strong><p>Формат с полями companies, people, links, meetings, tasks. Сохраняет все профили и дополнительные поля.</p><div class="formactions"><button class="btn primary" onclick="exportJSON()">Скачать JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Импорт JSON</button></div></div><div class="fact"><strong>CSV — список контактов</strong><p>Столбцы: name, role, department, company, contact, interests, work_priority, approach. Новая CSV-таблица добавляется как отдельная компания.</p><div class="formactions"><button class="btn" onclick="exportCSV()">Экспорт CSV</button><button class="btn" onclick="document.getElementById('importFile').click()">Импорт CSV</button></div></div></div><h3>Сохранение</h3><p class="muted">Все изменения сохраняются в локальном хранилище браузера на этом устройстве. Для переноса между устройствами используйте экспорт и импорт JSON. Серверная синхронизация и автоматическая интеграция с почтой пока не подключены.</p><div class="formactions"><button class="btn" onclick="if(confirm('Сбросить все изменения и восстановить исходную базу?')){db=structuredClone(INITIAL);normalize(db);save();company=db.companies[0]?.id;selected=db.people[0]?.id;render()}">Восстановить исходную базу</button></div></section>`}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportJSON(){download('croc_connect_database.json',JSON.stringify(db,null,2),'application/json;charset=utf-8')}
function csvcell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){let keys=['name','role','department','company','contact','interests','work_priority','approach'];let rows=[keys.join(','),...people().map(p=>keys.map(k=>csvcell(k==='company'?db.companies.find(c=>c.id===p.company_id)?.name:p[k])).join(','))];download('croc_contacts.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(s){let rows=[],row=[],field='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){field+='"';i++}else q=!q}else if(c===','&&!q){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importFile(e){let f=e.target.files[0];if(!f)return;try{let text=await f.text(),incoming;if(f.name.toLowerCase().endsWith('.json')){incoming=JSON.parse(text);if(Array.isArray(incoming))incoming={people:incoming,companies:[{id:'imported',name:'Импорт'}]};if(!Array.isArray(incoming.people)||!incoming.people.length)throw Error('В JSON нет массива people');if(!incoming.companies?.length)incoming.companies=[{id:'imported',name:'Импорт'}];normalize(incoming);incoming.people.forEach((p,i)=>{p.id=p.id||'imp_'+i;p.company_id=p.company_id||incoming.companies[0].id})}else if(f.name.toLowerCase().endsWith('.csv')){let rows=parseCSV(text.replace(/^\ufeff/,''));if(rows.length<2)throw Error('В CSV нет записей');let h=rows.shift().map(x=>x.trim().toLowerCase()),map={фио:'name',имя:'name',должность:'role',отдел:'department',подразделение:'department',компания:'company',контакты:'contact',телефон:'contact',интересы:'interests',приоритеты:'work_priority',подход:'approach'};let objs=rows.map(r=>Object.fromEntries(h.map((k,i)=>[map[k]||k,r[i]||''])));if(!objs.some(o=>o.name))throw Error('Нужен столбец name или ФИО');let cid='csv_'+Date.now(),cname=objs[0].company||f.name.replace(/\.csv$/i,'');incoming={companies:[{id:cid,name:cname}],people:objs.filter(o=>o.name).map((o,i)=>({...o,id:cid+'_'+i,company_id:cid,stance:'unknown',leader_details:{}})),links:[],interactions:[],meetings:[],tasks:[]}}else throw Error('Поддерживаются только JSON и CSV');if(!confirm(`Импортировать ${incoming.people.length} сотрудников? Текущие данные будут заменены. Сначала экспортируйте резервную копию при необходимости.`))return;db=incoming;save();company=db.companies[0].id;selected=db.people[0]?.id;view='tree';render();alert('База импортирована успешно')}catch(err){alert('Ошибка импорта: '+err.message)}finally{e.target.value=''}}
render();</script></body></html>
